<!DOCTYPE html>
<html>
<head>
<title>Country Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="navbar">
  <h1>🌍 Country Finder</h1>
  <span>Country &amp; Weather Explorer</span>
</div>

<div class="search-box">
  <h2>Explore the <span>World</span></h2>
  <p>Search any country to see its details and live weather</p>

  <div class="search-wrap">
    <input type="text" id="countryInput" placeholder="Enter country name">
    <button id="searchBtn">Search</button>
  </div>

  <div class="examples">
    <button class="example-btn" onclick="quickSearch('Japan')">Japan</button>
    <button class="example-btn" onclick="quickSearch('Italy')">Italy</button>
    <button class="example-btn" onclick="quickSearch('Canada')">Canada</button>
    <button class="example-btn" onclick="quickSearch('Bangladesh')">Bangladesh</button>
  </div>
</div>

<div id="status"></div>

<div id="results"></div>

<div class="overlay" id="overlay">
  <div id="weatherBox">
    <h3 id="weatherTitle"></h3>
    <div id="weatherIcon"></div>
    <div id="weatherTemp"></div>
    <div id="weatherExtra"></div>
    <div id="weatherCodeLine"></div>
    <button id="closeBtn">Close</button>
  </div>
</div>

<div class="footer">
  Country Finder Project 2026 &nbsp;|&nbsp;
  Data from <a href="https://restcountries.com" target="_blank">REST Countries</a> and
  <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>
</div>

<script src="script.js"></script>

</body>
</html>
